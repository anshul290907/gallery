name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: python3 make_icon.py && npx @capacitor/assets generate --android --iconBackgroundColor '#5c6eff' --iconBackgroundColorDark '#2a2f7a' || echo "icon generation skipped"
      - run: npx cap sync android
      - name: Set version (versionCode = run number)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName\|applicationId" android/app/build.gradle
      - name: Debug APK (for testing on your phone)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Signed release AAB (for Google Play)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          cd android && ./gradlew bundleRelease
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore $RUNNER_TEMP/upload.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | head -3
      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        with:
          name: gallery-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
